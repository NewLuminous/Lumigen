---
apiVersion: v1
kind: Namespace
metadata:
  name: lumigen
---
apiVersion: v1
kind: Namespace
metadata:
  name: spark-execution
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: lumigen
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-execution-role
  namespace: spark-execution
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["create", "get", "watch", "list", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver-role-binding
  namespace: spark-execution
subjects:
- kind: ServiceAccount
  name: spark
  namespace: lumigen
roleRef:
  kind: Role
  name: spark-execution-role
  apiGroup: rbac.authorization.k8s.io