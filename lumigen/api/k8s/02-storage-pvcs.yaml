---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-checkpoints-pvc
  namespace: lumigen
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-log-pvc
  namespace: lumigen
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi