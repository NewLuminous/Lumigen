source:
  type: iceberg
  catalog_type: jdbc
  warehouse: s3a://<bucketname>/warehouse
  uri: jdbc:postgresql://<DBHost>:5432/iceberg_catalog
  catalog_properties:
    cache-enabled: "true"
    jdbc.user: postgres
    jdbc.password: postgres
  hadoop.config:
    fs.s3a.endpoint: s3.cn-north-1.amazonaws.com.cn
    fs.s3a.access.key: xxxxxxxxxxxxxxxxx
    fs.s3a.secret.key: xxxxxxxxxxxxxxxxx
    fs.defaultFS: s3a://<bucketname>

sink:
  type: iceberg
  catalog_type: nessie
  warehouse: s3a://<bucketname>/warehouse
  uri: http://<nessieServer>:19120/api/v1
  catalog_properties:
    ref: main
    authentication.type: OAUTH2
    authentication.oauth2.token-endpoint: https://auth.yourdomain.com/realms/<Realm>/protocol/openid-connect/token
    authentication.oauth2.issuer-url: https://auth.yourdomain.com/realms/<Realm>
    authentication.oauth2.client-id: xxxxxxxxxxxxxxxxx
    authentication.oauth2.client-secret: xxxxxxxxxxxxxxxxx
    authentication.oauth2.username: xxxxxxxxxxxxxxxxx
    authentication.oauth2.password: xxxxxxxxxxxxxxxxx
    authentication.oauth2.scope: "openid profile email"
    authentication.oauth2.grant-type: password

  hadoop.config:
    fs.s3a.endpoint: s3.cn-north-1.amazonaws.com.cn
    fs.s3a.access.key: xxxxxxxxxxxxxxxxx
    fs.s3a.secret.key: xxxxxxxxxxxxxxxxx
    fs.defaultFS: s3a://<bucketname>

executor:
  type: spark
  app_name: batch iceberg
  config:
    spark.scheduler.mode: FAIR

job_properties:
  source_table: s3_jdbc_catalog.user_data
  sink_table: s3_nessie_catalog.user_data
  data_save_mode: MERGE
  sink_key: user_id